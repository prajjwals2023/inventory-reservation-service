services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-reservation-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/inventory_db?schema=public
      - PORT=3000
      - RESERVATION_TTL_MINUTES=15
      - CLEANUP_INTERVAL_SECONDS=30
      - NODE_ENV=production
      - ADMIN_API_KEY=admin-secret-key-123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: inventory-reservation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      # Map host 5434 to container 5432 to avoid conflict with any host Postgres service
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
